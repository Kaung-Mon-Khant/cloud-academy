name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cloudacademy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/cloudacademy?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrate and seed (verifies migrations + seed data against real Postgres)
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          POSTGRES_PASSWORD: ci
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aws, azure]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
